name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p 3.12 && uv pip install -e ".[dev]"
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q
  windows-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: one-command setup (data folder with a space in its path)
        shell: pwsh
        run: ./scripts/setup.ps1 -Dev -DataDir "$env:RUNNER_TEMP\SortLens Data"
      - name: launcher works
        shell: cmd
        run: |
          set "SORTLENS_DATA_DIR=%RUNNER_TEMP%\SortLens Data"
          sortlens.cmd doctor && sortlens.cmd stats
      - name: all checks on Windows
        shell: pwsh
        run: ./scripts/check.ps1
